name: Actions infra smoke

on:
  workflow_dispatch:
  push:
    branches:
      - "spike/**"
    paths:
      - ".github/workflows/actions-infra-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: Runner smoke (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Echo
        run: echo "actions-runner-ok"
