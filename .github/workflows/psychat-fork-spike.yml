name: PsyChat fork spike

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "spike/**"
    paths:
      - "evals/**"
      - "docs/evaluation/harness.md"
      - "docs/adr/ADR-000-fork-vs-greenfield.md"
      - ".github/workflows/psychat-fork-spike.yml"

permissions:
  contents: read

jobs:
  harness:
    name: AtentoEval unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run harness tests
        run: python -m unittest discover -s evals/tests -p "test_*.py" -v

      - name: Run deterministic RAG harness plumbing probe
        run: |
          python evals/spikes/psychat/rag_harness_probe.py \
            --cases evals/cases/rag_v0.jsonl \
            --output evals/results/psychat_rag_harness_plumbing.json

      - uses: actions/upload-artifact@v4
        with:
          name: psychat-rag-harness-plumbing
          path: evals/results/psychat_rag_harness_plumbing.json
          if-no-files-found: error

  psychat-static:
    name: PsyChat upstream, isolation and fork patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone pinned PsyChat donor
        run: |
          git clone https://github.com/wink-wink-wink555/PsyChat.git /tmp/PsyChat
          cd /tmp/PsyChat
          git checkout 5bf6f806e0f30e45b4e1dd72282fd6afd83b66f4
          test "$(git rev-parse HEAD)" = "5bf6f806e0f30e45b4e1dd72282fd6afd83b66f4"

      - name: Verify PsyChat gold IDs against pinned corpus
        run: |
          python evals/spikes/psychat/gold_source_probe.py \
            --donor-root /tmp/PsyChat \
            --cases evals/cases/rag_v0.jsonl \
            --output evals/results/psychat_gold_source.json

      - name: Compile upstream donor Python sources
        run: |
          python -m compileall -q             /tmp/PsyChat/agent             /tmp/PsyChat/core             /tmp/PsyChat/data             /tmp/PsyChat/main.py             /tmp/PsyChat/config.py

      - name: Dynamic shared-session isolation probe
        run: |
          python evals/spikes/psychat/real_isolation_probe.py             --donor-root /tmp/PsyChat             --output evals/results/psychat_real_isolation.json

      - name: Dynamic real-source retrieval mechanics probe
        run: |
          python evals/spikes/psychat/retrieval_mechanics_probe.py \
            --donor-root /tmp/PsyChat \
            --output evals/results/psychat_retrieval_mechanics_upstream.json

      - name: Static upstream Chassis Fitness audit
        run: |
          python evals/chassis/donor_static_audit.py             --root /tmp/PsyChat             --source-id SRC-PSYCHAT             --upstream-commit 5bf6f806e0f30e45b4e1dd72282fd6afd83b66f4             --output evals/results/psychat_static_chassis.json

      - name: Git-backed change-surface lower bounds
        run: |
          python evals/spikes/psychat/change_surface_probe.py             --donor-root /tmp/PsyChat             --output evals/results/psychat_change_surface.json

      - name: Audit unpatched donor plus Atento wrapper
        run: |
          rm -rf /tmp/PsyChatComposed
          cp -R /tmp/PsyChat /tmp/PsyChatComposed
          mkdir -p /tmp/PsyChatComposed/atento_adapter
          cp -R evals/spikes/psychat/adapter/. /tmp/PsyChatComposed/atento_adapter/
          python evals/chassis/donor_static_audit.py             --root /tmp/PsyChatComposed             --source-id SRC-PSYCHAT+SRC-ATENTO-WRAPPER             --upstream-commit 5bf6f806e0f30e45b4e1dd72282fd6afd83b66f4             --output evals/results/psychat_unpatched_composed_chassis.json

      - name: Apply minimal BLOCO I fork patch
        run: |
          python evals/spikes/psychat/minimal_fork_patch.py             --donor-root /tmp/PsyChat             --output evals/results/psychat_minimal_fork_patch.json

      - name: Compile patched RAG donor surface
        run: |
          python -m compileall -q             /tmp/PsyChat/agent/psychology_agent.py             /tmp/PsyChat/core/vector_store.py             /tmp/PsyChat/core/rag_system.py

      - name: Dynamic provider replacement probe
        run: |
          python evals/spikes/psychat/provider_replacement_probe.py \
            --donor-root /tmp/PsyChat \
            --output evals/results/psychat_provider_replacement.json

      - name: Re-run retrieval mechanics on patched donor
        run: |
          python evals/spikes/psychat/retrieval_mechanics_probe.py \
            --donor-root /tmp/PsyChat \
            --output evals/results/psychat_retrieval_mechanics_patched.json

      - name: Compare upstream and patched retrieval mechanics
        run: |
          python evals/spikes/psychat/retrieval_preservation_probe.py \
            --upstream evals/results/psychat_retrieval_mechanics_upstream.json \
            --patched evals/results/psychat_retrieval_mechanics_patched.json \
            --output evals/results/psychat_retrieval_preservation.json

      - name: Audit patched BLOCO I donor plus Atento chassis
        run: |
          rm -rf /tmp/PsyChatRagBlock
          mkdir -p             /tmp/PsyChatRagBlock/agent             /tmp/PsyChatRagBlock/core             /tmp/PsyChatRagBlock/atento_adapter
          cp /tmp/PsyChat/agent/psychology_agent.py /tmp/PsyChatRagBlock/agent/
          cp /tmp/PsyChat/core/vector_store.py /tmp/PsyChatRagBlock/core/
          cp /tmp/PsyChat/core/rag_system.py /tmp/PsyChatRagBlock/core/
          cp -R evals/spikes/psychat/adapter/. /tmp/PsyChatRagBlock/atento_adapter/
          python evals/chassis/donor_static_audit.py             --root /tmp/PsyChatRagBlock             --source-id SRC-PSYCHAT-RAG-PATCH+SRC-ATENTO             --upstream-commit 5bf6f806e0f30e45b4e1dd72282fd6afd83b66f4             --output evals/results/psychat_patched_rag_chassis.json

      - name: Print reports
        run: |
          cat evals/results/psychat_gold_source.json
          cat evals/results/psychat_real_isolation.json
          cat evals/results/psychat_retrieval_mechanics_upstream.json
          cat evals/results/psychat_change_surface.json
          cat evals/results/psychat_static_chassis.json
          cat evals/results/psychat_unpatched_composed_chassis.json
          cat evals/results/psychat_minimal_fork_patch.json
          cat evals/results/psychat_provider_replacement.json
          cat evals/results/psychat_retrieval_mechanics_patched.json
          cat evals/results/psychat_retrieval_preservation.json
          cat evals/results/psychat_patched_rag_chassis.json

      - uses: actions/upload-artifact@v4
        with:
          name: psychat-block-i-evidence
          path: |
            evals/results/psychat_gold_source.json
            evals/results/psychat_real_isolation.json
            evals/results/psychat_retrieval_mechanics_upstream.json
            evals/results/psychat_change_surface.json
            evals/results/psychat_static_chassis.json
            evals/results/psychat_unpatched_composed_chassis.json
            evals/results/psychat_minimal_fork_patch.json
            evals/results/psychat_provider_replacement.json
            evals/results/psychat_retrieval_mechanics_patched.json
            evals/results/psychat_retrieval_preservation.json
            evals/results/psychat_patched_rag_chassis.json
          if-no-files-found: error

  adapted-static:
    name: Adapter-only chassis static audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit thin Atento boundary
        run: |
          python evals/chassis/donor_static_audit.py             --root evals/spikes/psychat/adapter             --source-id SRC-ATENTO             --output evals/results/psychat_adapted_chassis.json

      - name: Measure adapter change surface
        run: |
          python evals/spikes/psychat/adapter_change_surface_probe.py \
            --adapter-root evals/spikes/psychat/adapter \
            --output evals/results/psychat_adapter_change_surface.json
      - uses: actions/upload-artifact@v4
        with:
          name: psychat-adapted-chassis
          path: |
            evals/results/psychat_adapted_chassis.json
            evals/results/psychat_adapter_change_surface.json
          if-no-files-found: error
