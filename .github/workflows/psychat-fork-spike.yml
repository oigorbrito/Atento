name: PsyChat fork spike

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "spike/**"
    paths:
      - "evals/**"
      - "docs/evaluation/harness.md"
      - "docs/adr/ADR-000-fork-vs-greenfield.md"
      - ".github/workflows/psychat-fork-spike.yml"

permissions:
  contents: read

jobs:
  harness:
    name: AtentoEval unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run harness tests
        run: python -m unittest discover -s evals/tests -p "test_*.py" -v

  psychat-static:
    name: PsyChat static chassis baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone pinned PsyChat donor
        run: |
          git clone https://github.com/wink-wink-wink555/PsyChat.git /tmp/PsyChat
          cd /tmp/PsyChat
          git checkout 5bf6f806e0f30e45b4e1dd72282fd6afd83b66f4
          test "$(git rev-parse HEAD)" = "5bf6f806e0f30e45b4e1dd72282fd6afd83b66f4"

      - name: Compile donor Python sources
        run: |
          python -m compileall -q             /tmp/PsyChat/agent             /tmp/PsyChat/core             /tmp/PsyChat/data             /tmp/PsyChat/main.py             /tmp/PsyChat/config.py

      - name: Static Chassis Fitness audit
        run: |
          python evals/chassis/donor_static_audit.py             --root /tmp/PsyChat             --source-id SRC-PSYCHAT             --upstream-commit 5bf6f806e0f30e45b4e1dd72282fd6afd83b66f4             --output evals/results/psychat_static_chassis.json

      - name: Print report
        run: cat evals/results/psychat_static_chassis.json

      - uses: actions/upload-artifact@v4
        with:
          name: psychat-static-chassis
          path: evals/results/psychat_static_chassis.json
          if-no-files-found: error
