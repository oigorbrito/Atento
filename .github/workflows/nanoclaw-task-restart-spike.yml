name: Disposable NanoClaw task restart seam spike

on:
  push:
    branches:
      - codex/disposable-nanoclaw-mobile-replay-20261001
    paths:
      - ".github/workflows/nanoclaw-task-restart-spike.yml"
      - "tools/system_chassis/nanoclaw-task-restart-spike*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-restart-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout disposable Atento spike
        uses: actions/checkout@v4
      - name: Checkout exact NanoClaw pin
        uses: actions/checkout@v4
        with:
          repository: nanocoai/nanoclaw
          ref: 4c1eabd3ddd74cc3d71b1871da857391a9411c8d
          path: candidate
          persist-credentials: false
      - name: Verify exact candidate pin
        working-directory: candidate
        run: test "$(git rev-parse HEAD)" = "4c1eabd3ddd74cc3d71b1871da857391a9411c8d"
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - name: Install pinned dependencies
        working-directory: candidate
        run: pnpm install --frozen-lockfile
      - name: Build SQLite test dependency
        working-directory: candidate
        run: pnpm rebuild better-sqlite3
      - name: Inject only the disposable task recovery spike
        run: |
          cp tools/system_chassis/nanoclaw-task-restart-spike-worker.ts candidate/src/system-chassis-task-restart-spike-worker.ts
          cp tools/system_chassis/nanoclaw-task-restart-spike.atento.test.ts candidate/src/system-chassis-task-restart-spike.atento.test.ts
      - name: Execute one sequential spike case
        working-directory: candidate
        run: pnpm exec vitest run src/system-chassis-task-restart-spike.atento.test.ts --reporter=junit --outputFile=/tmp/nanoclaw-task-restart-spike.xml
      - name: Preserve raw JUnit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disposable-nanoclaw-task-restart-spike-${{ github.run_id }}
          path: /tmp/nanoclaw-task-restart-spike.xml
          if-no-files-found: warn
