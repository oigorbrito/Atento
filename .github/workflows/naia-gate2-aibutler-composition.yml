name: NAIA Gate2 AI Butler Composition
# Evidence-observability probe: no harness logic change.

on:
  push:
    paths:
      - ".github/workflows/naia-gate2-aibutler-composition.yml"
      - "tools/naia_gate2/aibutler/**"
      - "tools/naia_gate2/broker_runtime_adapter.py"
      - "evals/atentoeval/handoff_broker.py"
      - "evals/atentoeval/composition.py"
      - "evals/config/naia_gate2_aibutler_v1.json"
      - "evals/config/naia_gate2_composition_v1.json"
  pull_request:
    paths:
      - ".github/workflows/naia-gate2-aibutler-composition.yml"
      - "tools/naia_gate2/aibutler/**"
      - "tools/naia_gate2/broker_runtime_adapter.py"
      - "evals/atentoeval/handoff_broker.py"
      - "evals/atentoeval/composition.py"
      - "evals/config/naia_gate2_aibutler_v1.json"
      - "evals/config/naia_gate2_composition_v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Atento harness
        uses: actions/checkout@v4

      - name: Checkout exact AI Butler pin
        uses: actions/checkout@v4
        with:
          repository: LumabyteCo/aibutler
          ref: c35d3af20f78f1a71ffe9cae76f8be6c8828fe6c
          path: candidate
          persist-credentials: false

      - name: Verify exact pin
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "c35d3af20f78f1a71ffe9cae76f8be6c8828fe6c"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: candidate/go.sum

      - name: Inject Atento Gate2 composition test
        run: |
          mkdir -p candidate/internal/atento_gate2
          cp tools/naia_gate2/aibutler/atento_gate2_test.go candidate/internal/atento_gate2/atento_gate2_test.go

      - name: Run Gate2 composition assertions with real Atento broker adapter
        working-directory: candidate
        env:
          ATENTO_GATE2_BROKER_ADAPTER: ${{ github.workspace }}/tools/naia_gate2/broker_runtime_adapter.py
          PYTHONPATH: ${{ github.workspace }}
        run: |
          go test ./internal/atento_gate2 -count=1 -v

      - name: Build canonical Gate2 evidence result
        run: |
          python3 tools/naia_gate2/aibutler/build_result.py \
            --config evals/config/naia_gate2_aibutler_v1.json \
            --output evals/results/naia_gate2_aibutler_runtime.json

      - name: Validate Gate2 evidence result
        run: |
          python3 -m evals.atentoeval.composition validate-result \
            --matrix evals/config/naia_gate2_composition_v1.json \
            --result evals/results/naia_gate2_aibutler_runtime.json

      - name: Upload Gate2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: naia-gate2-aibutler-${{ github.sha }}
          path: evals/results/naia_gate2_aibutler_runtime.json
          if-no-files-found: error
